name: Dump FS Size

on:
  push:

permissions:
  contents: read

jobs:
  dump-fssize:
    name: Dump Filesystem Size Information
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Dump Initial fsSize Information
        run: |
          echo "=== Initial Filesystem Size Information ==="
          node scripts/dump-fssize.js

      - name: Create 10GB Test File
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          echo "Creating 10GB test file..."
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows: Use fsutil to create a sparse file
            # Convert Unix-style path to Windows-style path for fsutil
            if command -v cygpath &> /dev/null; then
              WIN_TEMP=$(cygpath -w "$TEMP")
              TEST_FILE="$WIN_TEMP\\test-10gb-file.bin"
            else
              # Fallback: assume TEMP is already Windows-style
              TEST_FILE="$TEMP\\test-10gb-file.bin"
            fi
            fsutil file createnew "$TEST_FILE" 10737418240
            echo "10GB file created at: $TEST_FILE"
            # Store Unix-style path for other steps
            if command -v cygpath &> /dev/null; then
              UNIX_TEST_FILE=$(cygpath -u "$TEST_FILE")
              echo "TEST_FILE=$UNIX_TEST_FILE" >> $GITHUB_ENV
            else
              echo "TEST_FILE=$TEST_FILE" >> $GITHUB_ENV
            fi
          else
            # Unix-like (Linux/macOS): Use dd
            TEST_FILE="/tmp/test-10gb-file.bin"
            # Note: status=progress is not supported on macOS (BSD dd)
            # Also, macOS uses lowercase 'm' for megabytes (base-10) vs Linux 'M' (base-2)
            # To create exactly 10GB on both: 10240 * 1024 * 1024 = 10737418240 bytes
            if [ "$RUNNER_OS" = "macOS" ]; then
              # macOS: bs=1m (1,000,000 bytes), count=10737 creates ~10.74GB
              # Use bs=1m count=10240 to match Linux output size more closely
              dd if=/dev/zero of="$TEST_FILE" bs=1m count=10240
            else
              # Linux: bs=1M (1,048,576 bytes), count=10240 creates exactly 10737418240 bytes
              dd if=/dev/zero of="$TEST_FILE" bs=1M count=10240 status=progress
            fi
            echo "10GB file created at: $TEST_FILE"
            ls -lh "$TEST_FILE"
            echo "TEST_FILE=$TEST_FILE" >> $GITHUB_ENV
          fi

      - name: Dump fsSize Information After File Creation
        run: |
          echo "=== Filesystem Size Information After 10GB File Creation ==="
          node scripts/dump-fssize.js

      - name: Determine and Log Mount Point
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          echo "=== Determining Mount Point for Test File ==="
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows: Extract drive letter from TEST_FILE and show volume info
            echo "Test file location: $TEST_FILE"
            # Extract drive letter from TEST_FILE path (Git Bash format: /c/... or Windows format: C:\...)
            DRIVE=""
            if [[ "$TEST_FILE" =~ ^/([a-zA-Z])/ ]]; then
              DRIVE="${BASH_REMATCH[1]}:"
            elif [[ "$TEST_FILE" =~ ^([a-zA-Z]):[\\/] ]]; then
              DRIVE="${BASH_REMATCH[1]}:"
            fi
            
            if [ -z "$DRIVE" ]; then
              echo "Error: Could not determine drive letter from TEST_FILE=$TEST_FILE"
              echo "Expected format: /c/... (Git Bash) or C:\... (Windows)"
              exit 1
            fi
            
            echo "Drive: $DRIVE"
            echo "Volume information for $DRIVE:"
            fsutil volume diskfree "$DRIVE"
          else
            # Unix-like: Use df to find mount point
            if [ -z "$TEST_FILE" ]; then
              echo "Error: TEST_FILE was not set from previous step"
              exit 1
            fi
            echo "Test file location: $TEST_FILE"
            echo "Mount point information:"
            df -h "$TEST_FILE"
            echo ""
            echo "Mount point: $(df "$TEST_FILE" | tail -n 1 | awk '{print $NF}')"
          fi

      - name: Cleanup Test File
        if: always()
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          echo "Cleaning up test file..."
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -z "$TEST_FILE" ]; then
              # Convert Unix-style path to Windows-style path for cleanup
              if command -v cygpath &> /dev/null; then
                WIN_TEMP=$(cygpath -w "$TEMP")
                TEST_FILE="$WIN_TEMP\\test-10gb-file.bin"
              else
                # Fallback: assume TEMP is already Windows-style
                TEST_FILE="$TEMP\\test-10gb-file.bin"
              fi
              echo "Warning: TEST_FILE was not set, using default: $TEST_FILE"
            fi
            # Convert to Unix-style path for rm command if cygpath is available
            if command -v cygpath &> /dev/null; then
              UNIX_TEST_FILE=$(cygpath -u "$TEST_FILE")
            else
              UNIX_TEST_FILE="$TEST_FILE"
            fi
            if [ -f "$UNIX_TEST_FILE" ]; then
              rm -f "$UNIX_TEST_FILE"
              echo "Test file removed: $TEST_FILE"
            else
              echo "Test file not found: $TEST_FILE"
            fi
          else
            if [ -z "$TEST_FILE" ]; then
              TEST_FILE="/tmp/test-10gb-file.bin"
              echo "Warning: TEST_FILE was not set, using default: $TEST_FILE"
            fi
            if [ -f "$TEST_FILE" ]; then
              rm -f "$TEST_FILE"
              echo "Test file removed: $TEST_FILE"
            else
              echo "Test file not found: $TEST_FILE"
            fi
          fi
