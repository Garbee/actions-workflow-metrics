name: Dump FS Size

on:
  push:

permissions:
  contents: read

jobs:
  dump-fssize:
    name: Dump Filesystem Size Information
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Dump fsSize Information
        run: node scripts/dump-fssize.js
