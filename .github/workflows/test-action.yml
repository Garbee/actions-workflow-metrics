name: Test Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read # To clone the repository
  actions: read # To retrieve information about the workflow run and jobs

jobs:
  test-basic:
    name: Test Basic Usage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start Workflow Telemetry
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  test-custom-interval:
    name: Test Custom Interval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start Workflow Telemetry with Custom Interval
        uses: ./
        with:
          interval_seconds: "2"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Simulate Workload
        run: |
          set -euo pipefail
          echo "Simulating CPU and memory intensive workload"
          sleep 10
          echo "Workload simulation complete"

  test-resource-visualization:
    name: Test Resource Visualization
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start Workflow Telemetry
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          memory_alert_threshold: "5"
          cpu_alert_threshold: "10"
          cpu_alert_duration: "10"
          disk_alert_threshold: "10"

      - name: CPU and Storage Intensive Activity
        run: |
          set -euo pipefail
          echo "Starting CPU-intensive activity for 15 seconds..."
          echo "Creating 5GB test file to demonstrate disk usage..."
          dd if=/dev/zero of=/tmp/test-5gb-file.bin bs=1M count=5120 status=progress
          echo "5GB file created at /tmp/test-5gb-file.bin"
          ls -lh /tmp/test-5gb-file.bin

          node -e "
          const startTime = Date.now();
          const endTime = startTime + 15000;
          let count = 0;
          while (Date.now() < endTime) {
            // CPU-intensive calculation
            for (let i = 0; i < 1000000; i++) {
              count += Math.sqrt(i);
            }
          }
          console.log('CPU-intensive activity completed. Count:', count);
          "

          echo "Removing 5GB test file..."
          rm -f /tmp/test-5gb-file.bin
          echo "Test file removed."

      - name: Memory Intensive Activity
        run: |
          set -euo pipefail
          echo "Starting memory-intensive activity for 15 seconds..."
          node -e "
          const arrays = [];
          const startTime = Date.now();

          // Allocate ~500MB of memory
          console.log('Allocating memory...');
          for (let i = 0; i < 50; i++) {
            arrays.push(new Array(10 * 1024 * 1024).fill(Math.random()));
          }
          console.log('Memory allocated:', arrays.length, 'arrays');

          // Hold memory for 15 seconds
          const endTime = startTime + 15000;
          while (Date.now() < endTime) {
            // Keep arrays in use
            if (arrays.length > 0 && Date.now() % 1000 < 10) {
              arrays[0][0] = Math.random();
            }
          }

          // Free memory
          console.log('Freeing memory...');
          arrays.length = 0;
          console.log('Memory freed. Activity completed.');
          "

      - name: Idle Activity
        run: |
          set -euo pipefail
          echo "Starting idle period for 5 seconds..."
          sleep 5
          echo "Idle period completed."
