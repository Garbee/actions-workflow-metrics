name: Test Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read # To clone the repository

jobs:
  test-basic:
    name: Test Basic Usage (${{ matrix.os }})
    permissions:
      contents: read # To clone the repository
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start Workflow Telemetry
        uses: ./

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  test-resource-load:
    name: Test with Resources Under Load (${{ matrix.os }})
    permissions:
      contents: read # To clone the repository
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start Workflow Telemetry
        uses: ./
        with:
          interval_seconds: "1"
          memory_alert_threshold: "5"
          cpu_alert_threshold: "10"
          cpu_alert_duration: "10"
          disk_alert_threshold: "10"

      - name: CPU and Storage Intensive Activity
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          echo "Starting CPU-intensive activity for 15 seconds..."
          
          # Create test file based on OS
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "Creating 5GB test file on Windows..."
            # Use fsutil on Windows (requires absolute path)
            TEST_FILE="$TEMP/test-5gb-file.bin"
            fsutil file createnew "$TEST_FILE" 5368709120
            echo "5GB file created at $TEST_FILE"
            ls -lh "$TEST_FILE"
          else
            echo "Creating 5GB test file to demonstrate disk usage..."
            dd if=/dev/zero of=/tmp/test-5gb-file.bin bs=1M count=5120 status=progress
            echo "5GB file created at /tmp/test-5gb-file.bin"
            ls -lh /tmp/test-5gb-file.bin
          fi

          node -e "
          const startTime = Date.now();
          const endTime = startTime + 15000;
          let count = 0;
          while (Date.now() < endTime) {
            // CPU-intensive calculation
            for (let i = 0; i < 1000000; i++) {
              count += Math.sqrt(i);
            }
          }
          console.log('CPU-intensive activity completed. Count:', count);
          "

          # Remove test file based on OS
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "Removing 5GB test file..."
            rm -f "$TEMP/test-5gb-file.bin"
            echo "Test file removed."
          else
            echo "Removing 5GB test file..."
            rm -f /tmp/test-5gb-file.bin
            echo "Test file removed."
          fi

      - name: Memory Intensive Activity
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          echo "Starting memory-intensive activity for 15 seconds..."
          
          # Determine memory allocation size based on OS
          # macOS runners have less memory available, so we allocate less
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export ARRAY_COUNT=10
            echo "Running on macOS - allocating ~150MB of memory"
          else
            export ARRAY_COUNT=50
            echo "Running on $RUNNER_OS - allocating ~500MB of memory"
          fi
          
          node -e "
          const arrays = [];
          const startTime = Date.now();
          const arrayCount = parseInt(process.env.ARRAY_COUNT || '50');

          console.log('Allocating memory for', arrayCount, 'arrays...');
          for (let i = 0; i < arrayCount; i++) {
            arrays.push(new Array(10 * 1024 * 1024).fill(Math.random()));
          }
          console.log('Memory allocated:', arrays.length, 'arrays');

          // Hold memory for 15 seconds
          const endTime = startTime + 15000;
          while (Date.now() < endTime) {
            // Keep arrays in use
            if (arrays.length > 0 && Date.now() % 1000 < 10) {
              arrays[0][0] = Math.random();
            }
          }

          // Free memory
          console.log('Freeing memory...');
          arrays.length = 0;
          console.log('Memory freed. Activity completed.');
          "

      - name: Idle Activity
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting idle period for 5 seconds..."
          sleep 5
          echo "Idle period completed."
