name: "actions-workflow-metrics"
author: "Jonathan Garbee"
description: "A GitHub Actions for collecting system metrics during workflows and outputting Mermaid charts"
branding:
  color: blue
  icon: cpu
inputs:
  interval_seconds:
    description: "Interval between metrics collection in seconds"
    default: "5"
    required: false
  github-token:
    description: "GitHub token for fetching workflow step information (optional)"
    required: false
runs:
  using: node24
  main: dist/main/index.bundle.js
  post: dist/post/index.bundle.js
